<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#16406f">
  <meta name="robots" content="noindex,nofollow">
  <title>Prudle Exams — Admin</title>

  <!-- Fonts + icons used by the V37 design (loaded early to avoid a flash of unstyled text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

  <!-- Faster first load of the services the page talks to -->
  <link rel="preconnect" href="https://esm.sh" crossorigin>
  <link rel="dns-prefetch" href="https://api.cloudinary.com">

  <!-- Not needed any more: the same CSS is bundled inside the JS file.
  <link rel="stylesheet" href="./assets/index-prudle.css"> -->

  <style>
    /* Shown only until the app replaces #root */
    html,body{margin:0;background:#eef3f8;font-family:"Tajawal","Poppins",system-ui,Arial,sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;color:#16406f;font-weight:700;font-size:15px}
    .boot i{display:block;width:34px;height:34px;margin:0 auto 12px;border-radius:50%;border:3px solid #cfe0f7;border-top-color:#16406f;animation:boot 0.9s linear infinite}
    @keyframes boot{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="root"><div class="boot"><div><i></i>جاري تحميل لوحة الاختبارات…</div></div></div>

  <noscript>
    <p style="padding:20px;text-align:center;font-family:Arial">يجب تفعيل JavaScript لاستخدام لوحة الاختبارات.</p>
  </noscript>

  <!-- prudle-worker-firestore-adapter.js must sit in the same ./assets/ folder.
       Change ?v=37 whenever you upload a new version so browsers don't keep the old file. -->
  <script type="module" src="./assets/prudle-quizzes-v37.js?v=37"></script>
</body>
</html>
